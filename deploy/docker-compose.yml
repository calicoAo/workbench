services:
  mysql:
    image: mysql:8.0
    container_name: personal-workbench-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: personal_workbench
      MYSQL_USER: workbench
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - workbench_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: personal-workbench-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://workbench:${MYSQL_PASSWORD}@mysql:3306/personal_workbench
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "3000"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: personal-workbench-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  migrate:
    image: flyway/flyway:10-alpine
    profiles:
      - tools
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - -url=jdbc:mysql://mysql:3306/personal_workbench?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - -user=workbench
      - -password=${MYSQL_PASSWORD}
      - -locations=filesystem:/flyway/sql
      - -connectRetries=60
      - -baselineOnMigrate=true
      - -baselineVersion=16
      - -baselineDescription=Production baseline before automated deployment
      - -validateOnMigrate=true
      - -validateMigrationNaming=true
      - migrate
    volumes:
      - ../db/migration:/flyway/sql:ro

volumes:
  workbench_mysql_data:
