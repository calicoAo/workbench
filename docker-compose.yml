services:
  mysql:
    image: mysql:8.0
    container_name: personal-workbench-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: personal_workbench
      MYSQL_USER: workbench
      MYSQL_PASSWORD: workbench_password
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - workbench_mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

volumes:
  workbench_mysql_data:
