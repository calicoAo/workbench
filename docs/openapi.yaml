      description: Uses operation receipts and the Tasks transaction-aware publish capability. The Task response never expands Quick Note body or tag.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertQuickNoteRequest" }
      responses:
        "200": { description: Task, optional Assignment, source relation, and receipt committed atomically }
        "409": { description: Reused operationId with changed parameters or Quick Note already converted }
  /settings:
    get:
      summary: Read profile, display preferences, writing-slot entrances, continuation capability, and all current categories
      responses:
        "200": { description: Settings snapshot; missing preference rows use read-only defaults }
    patch:
      summary: Update profile and display preferences
      description: Timezone changes affect defaults for future records only and never rewrite historical business dates or timezone snapshots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 64 }
                timezone: { type: string, example: Asia/Shanghai }
                reducedMotion: { type: boolean }
                showRewards: { type: boolean }
                fontScale: { type: integer, enum: [90, 100, 110], default: 100 }
                writingSlots:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: object
                    required: [slotKey, enabled, sortOrder]
                    properties:
                      slotKey: { type: string, enum: [MORNING_WRITING, JOURNAL, STOCK_REVIEW] }
                      enabled: { type: boolean }
                      sortOrder: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200": { description: Updated settings snapshot }
  /trash:
    get:
      summary: Compose recoverable deleted records without a universal Trash table
      description: Currently only Quick Notes has a complete soft-delete and restore capability. Responses contain summaries, never full personal text.
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [all, quick_note], default: all }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200": { description: User-scoped deleted summaries ordered by deletedAt then id }
  /trash/{type}/{id}/restore:
    post:
      summary: Dispatch an idempotent restore to the owning domain
      description: Trash does not write domain tables. The current quick_note type delegates to the Quick Notes restore capability.
      parameters:
        - in: path
          name: type
          required: true
          schema: { type: string, enum: [quick_note] }
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreQuickNoteRequest" }
      responses:
        "200": { description: Owner restore result }
        "409": { description: Version, state, or operation identity conflict }
