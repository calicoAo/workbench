openapi: 3.0.3
info:
  title: Personal Workbench API
  version: 0.1.0
servers:
  - url: http://localhost:3000/api
security:
  - BearerAuth: []
paths:
  /onboarding/status:
    get:
      summary: Read isolated onboarding progress and hint state
      responses:
        "200":
          description: Progress is eligible only for newly registered users; existing users opt in via restart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingStatusResponse" }
  /onboarding/flows/{flowId}/start:
    post:
      summary: Start a versioned onboarding flow
      parameters: [{ in: path, name: flowId, required: true, schema: { type: string, example: core-loop } }]
      responses:
        "200":
          description: Started flow
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingProgressResponse" } } }
  /onboarding/flows/{flowId}/advance:
    post:
      summary: Advance a typed onboarding flow after a real product action
      parameters: [{ in: path, name: flowId, required: true, schema: { type: string, example: core-loop } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stepId]
              properties:
                stepId: { type: string, enum: [publish, create, accept, start] }
      responses:
        "200":
          description: Updated flow progress
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingProgressResponse" } } }
        "409": { description: Step is not the current ordered flow step }
  /onboarding/flows/{flowId}/skip:
    post:
      summary: Skip an onboarding flow without domain side effects
      parameters: [{ in: path, name: flowId, required: true, schema: { type: string, example: core-loop } }]
      responses:
        "200":
          description: Skipped flow
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingProgressResponse" } } }
  /onboarding/flows/{flowId}/restart:
    post:
      summary: Explicitly restart onboarding without changing business data
      parameters: [{ in: path, name: flowId, required: true, schema: { type: string, example: core-loop } }]
      responses:
        "200":
          description: Restarted flow
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingProgressResponse" } } }
  /onboarding/hints/{hintKey}/seen:
    post:
      summary: Mark a versioned contextual hint as seen
      parameters: [{ in: path, name: hintKey, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingHintRequest" } } }
      responses: { "200": { description: Hint state updated } }
  /onboarding/hints/{hintKey}/dismiss:
    post:
      summary: Dismiss a versioned contextual hint
      parameters: [{ in: path, name: hintKey, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingHintRequest" } } }
      responses: { "200": { description: Hint state updated } }
  /writing/inspirations:
    get:
      summary: List the authenticated user's Writing inspiration library
      parameters:
        - { in: query, name: state, schema: { type: string, enum: [active, favorite, pinned, untagged, archived], default: active } }
        - { in: query, name: keyword, schema: { type: string } }
        - { in: query, name: tags, description: Comma-separated tags; all tags must match, schema: { type: string } }
      responses:
        "200": { description: QuickNote-backed inspiration cards and explicit tags }
    post:
      summary: Atomically create a QuickNote and add its Writing inspiration metadata
      responses:
        "200": { description: Created QuickNote-backed inspiration }
        "409": { description: operationId replay with another payload or optimistic conflict }
  /writing/inspirations/{id}:
    get:
      summary: Read one Writing inspiration and its source QuickNote
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
      responses: { "200": { description: Inspiration detail } }
    put:
      summary: Update inspiration metadata and the owned QuickNote content snapshot
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
      responses: { "200": { description: Updated inspiration }, "409": { description: Stale version or operation conflict } }
  /writing/inspirations/{id}/archive:
    post:
      summary: Archive only the Writing inspiration metadata
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
      responses: { "200": { description: Archived inspiration }, "409": { description: Stale version or operation conflict } }
  /writing/inspirations/{id}/unarchive:
    post:
      summary: Restore an archived Writing inspiration
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
      responses: { "200": { description: Unarchived inspiration }, "409": { description: Stale version or operation conflict } }
  /writing/inspiration-tags:
    get:
      summary: List normalized Writing tags and usage counts
      responses: { "200": { description: Explicit tag list } }
    post:
      summary: Create or reuse a normalized Writing tag
      responses: { "200": { description: Tag identity } }
  /writing/inspiration-tags/{id}/merge:
    post:
      summary: Merge one explicit Writing tag into another
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
      responses: { "200": { description: Merged tag identity } }
  /writing/inspiration-tags/{id}:
    put:
      summary: Rename a normalized Writing tag while preserving links
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
      responses: { "200": { description: Renamed tag }, "409": { description: Tag name conflict } }
    delete:
      summary: Delete a Writing tag and only its relations
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
      responses: { "200": { description: Deleted tag; inspirations and QuickNotes remain } }
  /quick-notes/{id}/inspiration:
    post:
      summary: Idempotently add an existing QuickNote to the Writing inspiration library
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
      responses: { "200": { description: Inspiration metadata and explicit tags } }
  /growth/overview:
    get:
      summary: Read the authenticated user's derived Hero Growth overview
      description: XP and level come from the Rewards owner; investment comes only from the canonical ActualTime read model; completed tasks come from immutable CompletionEvent history. Finance never contributes. Category history is interpreted through the current category mapping.
      parameters:
        - in: query
          name: period
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
        - in: query
          name: to
          description: Inclusive product business date; defaults from the user's configured timezone.
          schema: { type: string, format: date }
      responses:
        "200": { description: Hero progression, period summary, dimension distribution, unmapped attribution and derived recent activity }
  /growth/dimensions:
    get:
      summary: Read GrowthDimension configuration and current TaskCategory mappings
      responses:
        "200": { description: Ordered dimensions including disabled rows and all non-deleted categories }
    post:
      summary: Create an enabled custom GrowthDimension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color, sortOrder]
              properties:
                name: { type: string, maxLength: 64 }
                iconKey: { type: string, nullable: true, maxLength: 64 }
                color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
                sortOrder: { type: integer, minimum: 0 }
      responses:
        "200": { description: Stable dimension identity, generated dimensionKey and version }
  /growth/dimensions/{id}:
    put:
      summary: Rename, recolor, reorder, enable or disable a GrowthDimension
      description: Disabling atomically clears current TaskCategory mappings to the dimension; historical domain facts are unchanged.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: New version and whether categories were unmapped }
        "409": { description: Stale expectedVersion }
  /growth/category-mappings/{categoryId}:
    put:
      summary: Set or clear the current TaskCategory to GrowthDimension mapping
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dimensionKey]
              properties:
                dimensionKey: { type: string, nullable: true, maxLength: 32 }
      responses:
        "200": { description: Current mapping }
        "400": { description: Dimension is missing or disabled }
  /finance/initialize:
    post:
      summary: Explicitly initialize the authenticated user's default Finance categories
      description: GET endpoints remain pure. Replays use the shared mutation receipt identity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceOperationRequest" }
      responses:
        "200": { description: Initialization result and current category count }
        "409": { description: operationId was reused with another command or payload }
  /finance/overview:
    get:
      summary: Read Entry-derived assets, liabilities, net worth, monthly flow, accounts and recent transactions
      description: Asset total is signed CASH/BANK/PAYMENT plus positive CREDIT; liabilities are the absolute negative CREDIT balances; net worth is the signed sum of included accounts. OPENING is excluded from monthly flow.
      parameters:
        - in: query
          name: month
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
      responses:
        "200": { description: API-owned Finance overview; all cents are integer strings }
  /finance/accounts:
    get:
      summary: List Finance accounts with POSTED Entry-derived balances
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [active, archived, all], default: active }
      responses:
        "200": { description: User-owned accounts and derived balanceCents }
    post:
      summary: Atomically create an account and optional OPENING transaction and Entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFinanceAccountRequest" }
      responses:
        "200": { description: Stable account identity, version and opening result }
        "409": { description: operationId identity conflict }
  /finance/accounts/{id}:
    put:
      summary: Update safe account metadata or archive/restore using expectedVersion
      description: Account type, currency, opening date and opening balance are not editable in FIN-01.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFinanceAccountRequest" }
      responses:
        "200": { description: New account version }
        "409": { description: Stale expectedVersion }
  /finance/accounts/{id}/archive:
    post:
      summary: Archive a Finance account without deleting history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceArchiveRequest" }
      responses:
        "200": { description: Archived account version }
        "409": { description: Stale version or mutation receipt conflict }
  /finance/accounts/{id}/unarchive:
    post:
      summary: Restore an archived Finance account
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceArchiveRequest" }
      responses:
        "200": { description: Restored account version }
        "409": { description: Stale version or mutation receipt conflict }
  /finance/categories:
    get:
      summary: List Finance-only income and expense categories including disabled history references
      responses:
        "200": { description: User-owned categories }
    post:
      summary: Create a Finance category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFinanceCategoryRequest" }
      responses:
        "200": { description: Category identity and version }
        "409": { description: Duplicate name in the same kind }
  /finance/categories/{id}:
    put:
      summary: Rename, sort, enable or disable a Finance category with expectedVersion
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFinanceCategoryRequest" }
      responses:
        "200": { description: New category version }
        "409": { description: Stale expectedVersion or duplicate name }
  /finance/transactions:
    get:
      summary: Filter and cursor-page immutable posted Finance transactions
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: accountId, schema: { type: integer, format: int64 } }
        - { in: query, name: categoryId, schema: { type: integer, format: int64 } }
        - { in: query, name: type, schema: { type: string, enum: [OPENING, INCOME, EXPENSE, TRANSFER, REFUND, REVERSAL, CORRECTION] } }
        - { in: query, name: keyword, schema: { type: string, maxLength: 100 } }
        - { in: query, name: cursor, schema: { type: integer, format: int64 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200": { description: Transaction items and nextCursor; signed amountCents are strings }
  /finance/transactions/{id}:
    get:
      summary: Read one user-owned Finance transaction and its FIN-01 Entry projection
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Transaction detail }
        "404": { description: Transaction not found for the authenticated user }
    put:
      summary: Update only the transaction note using expectedVersion
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFinanceTransactionNoteRequest" }
      responses:
        "200": { description: New transaction version }
        "409": { description: Stale expectedVersion }
  /finance/income:
    post:
      summary: Atomically post one INCOME transaction and positive Entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFinanceRecordRequest" }
      responses:
        "200": { description: Transaction, Entry, timezone snapshot and business date }
        "409": { description: Receipt identity, account state or category invariant conflict }
  /finance/expenses:
    post:
      summary: Atomically post one EXPENSE transaction and negative Entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFinanceRecordRequest" }
      responses:
        "200": { description: Transaction, Entry, timezone snapshot and business date }
        "409": { description: Receipt identity, account state or category invariant conflict }
  /finance/transfers:
    post:
      summary: Atomically transfer CNY between two active accounts, with an optional linked fee expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFinanceTransferRequest" }
      responses:
        "200": { description: One TRANSFER header, two Entries, and optional fee transaction }
        "409": { description: Account, currency, receipt, or concurrency invariant conflict }
  /finance/transactions/{id}/refunds:
    post:
      summary: Append a partial or full refund linked to an EXPENSE transaction
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFinanceRefundRequest" }
      responses:
        "200": { description: Refund identity and remaining refundable cents }
        "409": { description: Version, status, or cumulative refund conflict }
  /finance/transactions/{id}/correct:
    post:
      summary: Append a REVERSAL and replacement CORRECTION while retaining the original
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFinanceCorrectionRequest" }
      responses:
        "200": { description: Replacement and reversal transaction identities }
        "409": { description: Version, status, or category conflict }
  /finance/transactions/{id}/void:
    post:
      summary: Void a posted income or expense by appending a reversal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFinanceVoidRequest" }
      responses:
        "200": { description: Reversal identity and VOIDED original status }
        "409": { description: Version or status conflict }
  /habits:
    get:
      summary: List Habit definitions with effective-dated rule and goal histories
      responses:
        "200": { description: User-owned Habit definitions and version rows }
    post:
      summary: Create a Habit definition, initial rule, and initial goal atomically
      description: operationId makes an identical retry return the original result without duplicate rows.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHabitRequest" }
      responses:
        "200": { description: Habit identity and version }
        "409": { description: operationId identity conflict }
  /habits/summary:
    get:
      summary: Derive daily and Monday-based weekly Habit status plus specialized life projections
      description: Pending and missed are derived without occurrence writes. Water, Morning Writing, and Sleep remain projections of their specialized owners.
      parameters:
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { description: Expected habits, weekly progress, and specialized life summary }
  /habits/{id}:
    get:
      summary: Read one Habit with rule, goal, occurrence, and Task-link history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Habit detail }
        "404": { description: Habit not found for the authenticated user }
  /habits/{id}/rule:
    put:
      summary: Add a future-effective Habit schedule rule version
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitRuleRevisionRequest" }
      responses:
        "200": { description: Updated Habit version }
        "409": { description: Version or effective-date conflict }
  /habits/{id}/goal:
    put:
      summary: Add a future-effective Habit goal version
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitGoalRevisionRequest" }
      responses:
        "200": { description: Updated Habit version }
        "409": { description: Version or effective-date conflict }
  /habits/{id}/state:
    put:
      summary: Add a future-effective enable or disable rule and archive or restore the definition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitStateRequest" }
      responses:
        "200": { description: Updated Habit state and version }
        "409": { description: Version or effective-date conflict }
  /habits/{id}/occurrences:
    post:
      summary: Create or edit an explicit Habit occurrence
      description: Stores completed, partial, or skipped facts only. Future and missed rows are never pre-generated.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordHabitOccurrenceRequest" }
      responses:
        "200": { description: Occurrence identity, version, status, and actual value }
        "409": { description: Occurrence conflict or Habit not expected on date }
  /habits/{id}/task:
    post:
      summary: Publish and accept one Task for one Habit occurrence date
      description: Unique by user, Habit, and occurrenceDate. Only an explicitly configured binary Habit can be completed by its linked Task; no Habit reward is added.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishHabitTaskRequest" }
      responses:
        "200": { description: Stable linked Task identity }
        "409": { description: operationId identity conflict }
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service status
  /auth/register:
    post:
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registered user and token
  /auth/login:
    post:
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged-in user and token
        "401":
          description: Invalid username or password
  /auth/me:
    get:
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthUser"
  /dashboard:
    get:
      summary: Get the read-only dashboard aggregate
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Dashboard"
  /daily-carryovers:
    post:
      summary: Carry unfinished work forward to a selected date
      description: Safe to retry. Existing target-date assignments, plan projections, and handled source records are not duplicated. Daily-assignment inheritance and planned-Schedule carryover commit independently; if the latter fails, a retry completes the remaining work without duplicating the committed assignment result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyDailyCarryoverRequest"
      responses:
        "200":
          description: Daily carryover applied or already complete
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [targetDate]
                        properties:
                          targetDate:
                            type: string
                            format: date
        "400":
          description: Invalid targetDate request
        "401":
          description: Authentication required
        "500":
          description: Carryover workflow failed; independently committed work remains retry-safe
  /task-days:
    get:
      summary: Get tasks accepted for a day
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily accepted task ids
    put:
      summary: Replace tasks accepted for a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDailyTasksRequest"
      responses:
        "200":
          description: Saved daily accepted tasks
  /task-days/continuations:
    get:
      summary: List actionable Assignment continuation candidates
      description: Pure read. Legacy unresolved rows are excluded; deferred rows appear only when their target date is due.
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Actionable Assignment and Task pairs
  /task-days/accept:
    post:
      summary: Accept a Task for one business date
      description: Retryable command. The same operationId and fingerprint replays the committed Assignment; changed parameters return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptTaskForDateRequest"
      responses:
        "200":
          description: Existing or newly accepted Assignment
        "409":
          description: operationId reuse conflict or Task cannot be accepted
  /task-days/{id}/release:
    put:
      summary: Release one accepted Assignment without deleting historical time
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedCommandRequest"
      responses:
        "200":
          description: Assignment released
        "409":
          description: Version or operation identity conflict
  /task-days/continuations/resolve:
    post:
      summary: Resolve one Task's continuation sources atomically
      description: Supports carried-forward, deferred, dismissed, and rescheduled outcomes. Every source version is validated before any source is changed.
      requestBody:
        required: true
        content:
