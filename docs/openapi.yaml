            expectedTaskVersion:
              type: integer
              minimum: 1
              description: Required when completeTask is true.
            completionNote:
              type: string
              maxLength: 1000
            progressPercent:
              type: integer
              minimum: 0
              maximum: 99
              description: Optional Task progress update committed with finish; requires expectedTaskVersion.
            note:
              type: string
              maxLength: 500
              description: Optional Session note.
    CreateScheduleRequest:
