            schema:
              $ref: "#/components/schemas/CompleteTaskRequest"
      responses:
        "200":
          description: Task transition, completion event, continuation closure, reward, and receipt committed atomically
        "409":
          description: Active Session, stale version, or operation identity conflict
  /tasks/{id}/reopen:
    put:
      summary: Reopen a completed Task without resurrecting old continuations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReopenTaskRequest"
      responses:
        "200":
          description: Task reopened
        "409":
          description: Task is not complete, stale version, active Session, or operation identity conflict
  /tasks/{id}/archive:
    put:
      summary: Archive a Task and close pending continuations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedCommandRequest"
      responses:
        "200":
          description: Task archived
  /timer-sessions/start:
    post:
      summary: Start a previously accepted Task Session
      description: Atomically claims the execution slot and creates a vNext Session and first Segment. Matching retries replay the same Session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTimerRequest"
      responses:
        "200":
          description: Started timer session
        "409":
          description: Another Session owns the slot, Task/Assignment version conflict, or operationId conflict
  /timer-sessions/accept-and-start:
    post:
      summary: Accept a Task and start its Session atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptAndStartTimerRequest"
      responses:
        "200":
          description: Assignment, Task state, Session, Segment, slot, and receipt committed
        "409":
          description: Slot, Task version, or operation identity conflict
  /timer-sessions/current:
    get:
      summary: Get the current vNext execution session
      description: Pure read through user_execution_slots. Frozen legacy sessions are never eligible.
      responses:
        "200":
          description: Current vNext Session with Segments, or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/CurrentTimerSession"
  /timer-sessions/actual-time:
    get:
      summary: Get normalized ActualTime entries
      description: Includes closed TimerSegments and manual/eligible legacy Actual Schedules. TIMER Schedule projections are excluded.
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: timezone
          required: true
          schema:
            type: string
            example: Asia/Shanghai
      responses:
        "200":
          description: ActualTime entries clipped to the requested timezone day
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [date, timezone, entries]
                        properties:
                          date:
                            type: string
                            format: date
                          timezone:
                            type: string
                          entries:
                            type: array
                            items:
                              $ref: "#/components/schemas/ActualTimeEntry"
  /timer-sessions/{id}/pause:
    put:
      summary: Pause a running vNext Session
      description: Closes the open Segment and writes its TIMER projections in one transaction. The slot remains occupied and no final reward is granted.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Segment closed, projections written, Session paused, receipt committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionResultResponse"
        "404":
          description: Timer session does not belong to the authenticated user
        "409":
          description: Version, slot consistency, Session state, legacy model, or operation identity conflict
  /timer-sessions/{id}/resume:
    put:
      summary: Resume a paused vNext Session with a new Segment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCommandRequest"
      responses:
        "200":
          description: Exactly one new open Segment created
        "409":
          description: Version, slot consistency, Session state, legacy model, or operation identity conflict
  /timer-sessions/{id}/finish:
    put:
      summary: Finish a work session, optionally completing its task
      description: Repeating the same terminal command returns the existing result. A different command against a terminal session returns 409.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishWorkSessionRequest"
      responses:
        "200":
          description: Segments, all projections, rewards, slot release, and optional Task completion committed atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionResultResponse"
        "404":
          description: Timer session or associated task does not belong to the authenticated user
        "409":
          description: Version, slot consistency, terminal state, Task version, legacy model, or operation identity conflict
  /timer-sessions/{id}/cancel:
    put:
      summary: Cancel an active vNext Session and void its time facts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCommandRequest"
      responses:
        "200":
          description: Segments and projections voided, no reward granted, slot released
        "409":
          description: Finished, stale, inconsistent, legacy, or operation identity conflict
  /finance/budgets:
    get:
      summary: Read monthly total and category budgets with effective posted spend
      parameters:
        - { in: query, name: month, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" } }
    post:
      summary: Create or update one budget scope using operationId
  /finance/budgets/{id}:
    delete:
      summary: Delete a budget with expectedVersion and operationId
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
  /finance/reports:
    get:
      summary: Read deterministic monthly flow, category breakdown, account movement and reconciliation
      parameters:
        - { in: query, name: month, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" } }
  /finance/recurring-templates:
    get: { summary: List recurring Finance templates }
    post: { summary: Create a recurring Finance template }
  /finance/recurring-templates/{id}:
    put:
      summary: Edit a recurring Finance template with expectedVersion; processed occurrence snapshots remain immutable
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
  /finance/recurring-occurrences:
    get: { summary: List prepared recurring occurrences without writing on GET }
  /finance/recurring-occurrences/prepare:
    post: { summary: Explicitly prepare idempotent pending occurrences for a date range }
  /finance/recurring-occurrences/{id}/confirm:
    post:
      summary: Atomically post one pending occurrence through Finance transaction semantics
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
  /finance/recurring-occurrences/{id}/skip:
    post:
      summary: Explicitly skip one pending occurrence without creating a transaction
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
  /finance/imports/external/preview:
    post:
      summary: Stage and validate an external Finance CSV without posting ledger facts
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/FinanceExternalPreviewRequest" } }
      responses:
        "200": { description: Read-only preview batch with per-row validation and duplicate state }
        "409": { description: operationId conflict or duplicate batch identity }
  /finance/imports/{id}:
    get:
      summary: Read an isolated Finance import batch and row result report
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
  /finance/imports/{id}/rows/{rowId}:
    put:
      summary: Correct an unprocessed import row mapping or parsed value for retry
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
        - { in: path, name: rowId, required: true, schema: { type: integer, format: int64 } }
  /finance/imports/{id}/confirm:
    post:
      summary: Explicitly post selected ready import rows through the Finance capability
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/FinanceImportConfirmRequest" } }
  /finance/maintenance/export/json:
    post:
      summary: Explicit sensitive versioned Workbench Finance JSON backup export
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceOperationRequest" } } } }
  /finance/maintenance/export/csv:
    post:
      summary: Explicit sensitive human-readable Finance CSV export
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceOperationRequest" } } } }
  /finance/maintenance/restore/preview:
    post:
      summary: Validate a Workbench Finance backup before restore
  /finance/maintenance/restore/confirm:
    post:
      summary: Atomically restore a validated Finance backup into an empty Finance domain
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/FinanceRestoreConfirmRequest" } }
  /finance/maintenance/reconciliation:
    post:
      summary: Read-only Finance account reconciliation and anomaly report
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceOperationRequest" } } } }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OnboardingProgress:
      type: object
      required: [flowId, flowVersion, status, currentStepId, updatedAt]
      properties:
        flowId: { type: string, example: core-loop }
        flowVersion: { type: integer, minimum: 1, example: 1 }
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, SKIPPED] }
        currentStepId: { type: string, enum: [publish, create, accept, start], nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        skippedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    OnboardingHintState:
      type: object
      required: [hintKey, hintVersion]
      properties:
        hintKey: { type: string }
        hintVersion: { type: integer, minimum: 1 }
        seenAt: { type: string, format: date-time, nullable: true }
        dismissedAt: { type: string, format: date-time, nullable: true }
    OnboardingChecklist:
      type: object
      required: [published, accepted, started, completed, note]
      properties:
        published: { type: boolean }
        accepted: { type: boolean }
        started: { type: boolean }
        completed: { type: boolean }
        note: { type: boolean }
    OnboardingStatusResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data:
          type: object
          required: [eligible, flow, hints, checklist]
          properties:
            eligible: { type: boolean }
            flow: { $ref: "#/components/schemas/OnboardingProgress", nullable: true }
            hints:
              type: array
              items: { $ref: "#/components/schemas/OnboardingHintState" }
            checklist: { $ref: "#/components/schemas/OnboardingChecklist" }
    OnboardingProgressResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: { $ref: "#/components/schemas/OnboardingProgress" }
    OnboardingHintRequest:
      type: object
      required: [hintVersion]
      properties:
        hintVersion: { type: integer, minimum: 1, example: 1 }
    FinanceOperationRequest:
      type: object
      required: [operationId]
      properties:
        operationId: { type: string, format: uuid }
    FinanceExternalPreviewRequest:
      type: object
      required: [operationId, sourceName, csv, mapping, timezone]
      properties:
        operationId: { type: string, format: uuid }
        sourceName: { type: string }
        csv: { type: string }
        timezone: { type: string }
        mapping: { type: object, additionalProperties: { type: string } }
    FinanceImportConfirmRequest:
      type: object
      required: [operationId]
      properties:
        operationId: { type: string, format: uuid }
        rowIds: { type: array, items: { type: integer, format: int64 } }
        allowPossibleDuplicates: { type: boolean, default: false }
    FinanceRestoreConfirmRequest:
      type: object
      required: [operationId, backup]
      properties:
        operationId: { type: string, format: uuid }
        backup: { type: object }
    FinanceIntegerCents:
      type: string
      pattern: "^-?(0|[1-9]\\d*)$"
      description: Exact signed integer cents within MySQL BIGINT range; never a floating-point amount.
      example: "100000"
    CreateFinanceAccountRequest:
      type: object
      required: [operationId, name, type, openingDate, openingBalanceCents, includeInOverview]
      properties:
        operationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [CASH, BANK, PAYMENT, CREDIT] }
        currency: { type: string, enum: [CNY], default: CNY }
        openingDate: { type: string, format: date }
        openingBalanceCents: { $ref: "#/components/schemas/FinanceIntegerCents" }
        includeInOverview: { type: boolean, default: true }
    UpdateFinanceAccountRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        includeInOverview: { type: boolean }
        archived: { type: boolean }
    FinanceArchiveRequest:
      type: object
      required: [operationId, expectedVersion]
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
    CreateFinanceCategoryRequest:
      type: object
      required: [kind, name, sortOrder]
      properties:
        kind: { type: string, enum: [INCOME, EXPENSE] }
        name: { type: string, minLength: 1, maxLength: 64 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    UpdateFinanceCategoryRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 64 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        enabled: { type: boolean }
    CreateFinanceRecordRequest:
      type: object
      required: [operationId, accountId, categoryId, amountCents, occurredDate, occurredTime]
      properties:
        operationId: { type: string, format: uuid }
        accountId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        amountCents:
          type: string
          pattern: "^[1-9]\\d*$"
          description: Positive integer cents; the Finance owner applies the Entry sign from the command type.
        occurredDate: { type: string, format: date }
        occurredTime: { type: string, example: "18:30" }
        note: { type: string, maxLength: 500, nullable: true }
    UpdateFinanceRecurringTemplateRequest:
      type: object
      required: [operationId, expectedVersion]
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean }
        amountCents: { type: string, pattern: "^[1-9]\\d*$" }
        accountId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        frequency: { type: string, enum: [MONTHLY, WEEKLY] }
        scheduleValue: { type: integer, minimum: 0, maximum: 31 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
    CreateFinanceTransferRequest:
      type: object
      required: [operationId, sourceAccountId, targetAccountId, amountCents, occurredDate, occurredTime]
      properties:
        operationId: { type: string, format: uuid }
        sourceAccountId: { type: integer, format: int64 }
        targetAccountId: { type: integer, format: int64 }
        amountCents: { type: string, pattern: "^[1-9]\\d*$" }
        feeAmountCents: { type: string, pattern: "^[1-9]\\d*$" }
        feeCategoryId: { type: integer, format: int64 }
        occurredDate: { type: string, format: date }
        occurredTime: { type: string, example: "18:30" }
        note: { type: string, maxLength: 500, nullable: true }
    CreateFinanceRefundRequest:
      type: object
      required: [operationId, expectedVersion, amountCents, occurredDate, occurredTime]
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        amountCents: { type: string, pattern: "^[1-9]\\d*$" }
        accountId: { type: integer, format: int64 }
        occurredDate: { type: string, format: date }
        occurredTime: { type: string, example: "18:30" }
        note: { type: string, maxLength: 500, nullable: true }
    CreateFinanceCorrectionRequest:
      type: object
      required: [operationId, expectedVersion, amountCents, occurredDate, occurredTime]
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        amountCents: { type: string, pattern: "^[1-9]\\d*$" }
        accountId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        occurredDate: { type: string, format: date }
        occurredTime: { type: string, example: "18:30" }
        note: { type: string, maxLength: 500, nullable: true }
    CreateFinanceVoidRequest:
      type: object
      required: [operationId, expectedVersion]
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        occurredDate: { type: string, format: date }
        occurredTime: { type: string, example: "18:30" }
        note: { type: string, maxLength: 500, nullable: true }
    UpdateFinanceTransactionNoteRequest:
      type: object
      required: [expectedVersion, note]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 500, nullable: true }
    HabitRuleInput:
      type: object
      required: [frequencyType]
      properties:
        frequencyType: { type: integer, enum: [0, 1, 2], description: "0 daily, 1 weekday mask, 2 weekly N" }
        weekdayMask: { type: integer, minimum: 1, maximum: 127, nullable: true }
        weeklyTarget: { type: integer, minimum: 1, maximum: 7, nullable: true }
    CreateHabitRequest:
      type: object
      required: [operationId, name, startDate, recordMode, rule, targetValue]
      properties:
        operationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 4000, nullable: true }
        categoryId: { type: integer, format: int64, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
        recordMode: { type: integer, enum: [0, 1, 2, 3], description: "completion, count, quantity, minutes" }
        unit: { type: string, maxLength: 32, nullable: true }
        taskCompletionEnabled: { type: boolean, default: false }
        rule: { $ref: "#/components/schemas/HabitRuleInput" }
        targetValue: { type: number, exclusiveMinimum: 0 }
    HabitRevisionIdentity:
      type: object
      required: [operationId, expectedVersion, effectiveFrom]
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        effectiveFrom: { type: string, format: date }
    HabitRuleRevisionRequest:
      allOf:
        - $ref: "#/components/schemas/HabitRevisionIdentity"
        - type: object
          required: [rule]
          properties:
            rule: { $ref: "#/components/schemas/HabitRuleInput" }
    HabitGoalRevisionRequest:
      allOf:
        - $ref: "#/components/schemas/HabitRevisionIdentity"
        - type: object
          required: [targetValue]
          properties:
            targetValue: { type: number, exclusiveMinimum: 0 }
    HabitStateRequest:
      allOf:
        - $ref: "#/components/schemas/HabitRevisionIdentity"
        - type: object
          required: [action]
          properties:
            action: { type: string, enum: [disable, enable, archive, restore] }
    RecordHabitOccurrenceRequest:
      type: object
      required: [operationId, occurrenceDate, recordTimezone, expectedVersion]
      properties:
        operationId: { type: string, format: uuid }
        occurrenceDate: { type: string, format: date }
        recordTimezone: { type: string, example: Asia/Shanghai }
        expectedVersion: { type: integer, minimum: 0 }
        actualValue: { type: number, minimum: 0 }
        skipped: { type: boolean, default: false }
        skipReason: { type: string, maxLength: 500 }
    PublishHabitTaskRequest:
      type: object
      required: [operationId, occurrenceDate, recordTimezone]
      properties:
        operationId: { type: string, format: uuid }
        occurrenceDate: { type: string, format: date }
        recordTimezone: { type: string, example: Asia/Shanghai }
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
    AuthUser:
      type: object
      required: [id, username, displayName, timezone]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        timezone:
          type: string
          example: Asia/Shanghai
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [token, user]
              properties:
                token:
                  type: string
                user:
                  $ref: "#/components/schemas/AuthUser"
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_]+$"
        displayName:
          type: string
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 100
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    Dashboard:
      type: object
      properties:
        date:
          type: string
          format: date
        activeTimer:
          nullable: true
          $ref: "#/components/schemas/TimerSession"
        stockReviewRecord:
          nullable: true
          $ref: "#/components/schemas/StockReview"
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        sleepRecord:
          nullable: true
          $ref: "#/components/schemas/SleepRecord"
        journalRecord:
          nullable: true
          $ref: "#/components/schemas/Journal"
        morningWritingRecord:
          nullable: true
          $ref: "#/components/schemas/MorningWriting"
        waterRecord:
          nullable: true
          $ref: "#/components/schemas/WaterRecord"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        dailyTaskIds:
          type: array
          items:
            type: integer
            format: int64
        categories:
          type: array
          items:
            $ref: "#/components/schemas/TaskCategory"
        weeklySeries:
          type: array
          items:
            $ref: "#/components/schemas/WeeklySeriesItem"
        monthlySleepSeries:
          type: array
          items:
            $ref: "#/components/schemas/SleepSeriesItem"
        weeklyStats:
          type: object
          properties:
            totalMinutes:
              type: integer
            completedTasks:
              type: integer
            journalDays:
              type: integer
            stockReviewDays:
              type: integer
    ApplyDailyCarryoverRequest:
      type: object
      required: [targetDate]
      properties:
        targetDate:
          type: string
          format: date
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: integer
          format: int64
          nullable: true
        projectId:
          type: integer
          format: int64
          nullable: true
        status:
          type: integer
          enum: [0, 1, 2, 3]
        priority:
          type: integer
        difficulty:
          type: integer
          enum: [1, 2, 3, 4]
        pinned:
          type: integer
        sortOrder:
          type: integer
