openapi: 3.0.3
info:
  title: Personal Workbench API
  version: 0.1.0
servers:
  - url: http://localhost:3000/api
security:
  - BearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service status
  /auth/register:
    post:
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registered user and token
  /auth/login:
    post:
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged-in user and token
        "401":
          description: Invalid username or password
  /auth/me:
    get:
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthUser"
  /dashboard:
    get:
      summary: Get the read-only dashboard aggregate
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Dashboard"
  /daily-carryovers:
    post:
      summary: Carry unfinished work forward to a selected date
      description: Safe to retry. Existing target-date assignments, plan projections, and handled source records are not duplicated. Daily-assignment inheritance and planned-Schedule carryover commit independently; if the latter fails, a retry completes the remaining work without duplicating the committed assignment result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyDailyCarryoverRequest"
      responses:
        "200":
          description: Daily carryover applied or already complete
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [targetDate]
                        properties:
                          targetDate:
                            type: string
                            format: date
        "400":
          description: Invalid targetDate request
        "401":
          description: Authentication required
        "500":
          description: Carryover workflow failed; independently committed work remains retry-safe
  /task-days:
    get:
      summary: Get tasks accepted for a day
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily accepted task ids
    put:
      summary: Replace tasks accepted for a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDailyTasksRequest"
      responses:
        "200":
          description: Saved daily accepted tasks
  /task-days/continuations:
    get:
      summary: List actionable Assignment continuation candidates
      description: Pure read. Legacy unresolved rows are excluded; deferred rows appear only when their target date is due.
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Actionable Assignment and Task pairs
  /task-days/accept:
    post:
      summary: Accept a Task for one business date
      description: Retryable command. The same operationId and fingerprint replays the committed Assignment; changed parameters return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptTaskForDateRequest"
      responses:
        "200":
          description: Existing or newly accepted Assignment
        "409":
          description: operationId reuse conflict or Task cannot be accepted
  /task-days/{id}/release:
    put:
      summary: Release one accepted Assignment without deleting historical time
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedCommandRequest"
      responses:
        "200":
          description: Assignment released
        "409":
          description: Version or operation identity conflict
  /task-days/continuations/resolve:
    post:
      summary: Resolve one Task's continuation sources atomically
      description: Supports carried-forward, deferred, dismissed, and rescheduled outcomes. Every source version is validated before any source is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveContinuationRequest"
      responses:
        "200":
          description: All source Assignments resolved and optional target artifacts committed
        "409":
          description: Any source version changed or was already resolved; no partial update is committed
  /task-days/continuations/carry-over:
    post:
      summary: Carry continuation sources to one target Assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarryContinuationRequest"
      responses:
        "200":
          description: Sources closed and one target Assignment created or reused
  /stock-reviews:
    get:
      summary: Get stock review by date
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Stock review record
    post:
      summary: Upsert stock review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveStockReviewRequest"
      responses:
        "200":
          description: Saved stock review
  /task-categories:
    get:
      summary: List task categories
      responses:
        "200":
          description: Category list
    post:
      summary: Create task category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskCategoryRequest"
      responses:
        "200":
          description: Created category
  /task-categories/{id}:
    put:
      summary: Update task category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskCategoryRequest"
      responses:
        "200":
          description: Updated category
    delete:
      summary: Hard delete task category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Hard deleted category
  /schedules:
    get:
      summary: Read a one-to-seven day Calendar range with canonical daily execution summaries
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
        - in: query
          name: timezone
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Schedule rows and per-day canonical summaries
    post:
      summary: Create a timeline time block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "200":
          description: Created time block
  /schedules/{id}:
    put:
      summary: Update a Planned block or correct a Manual Actual record
      description: Retryable source-aware update. TIMER projections and Legacy Actual rows cannot be edited through this route.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectManualActualRequest"
      responses:
        "200":
          description: Manual Actual corrected once
        "409":
          description: Version, operation identity, overlap, or source-class conflict
    delete:
      summary: Delete a planned block or cancel a Manual Actual record
      description: Manual Actual cancellation requires operationId and expectedVersion. TIMER projections can only be changed by their Session workflow.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedCommandRequest"
      responses:
        "200":
          description: Planned block deleted or Manual Actual cancelled
        "409":
          description: TIMER projection, version, or operation identity conflict
  /schedules/{id}/reschedule:
    post:
      summary: Reschedule a Planned block by preserving the source and creating a replacement
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlannedScheduleRequest"
      responses:
        "200":
          description: Source marked RESCHEDULED and replacement PENDING block created atomically
  /sleep-records:
    get:
      summary: Get sleep record by date
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Sleep record
    post:
      summary: Upsert sleep record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSleepRecordRequest"
      responses:
        "200":
          description: Saved sleep record
  /journals:
    get:
      summary: Get journal by date
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Journal record
    post:
      summary: Upsert journal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveJournalRequest"
      responses:
        "200":
          description: Saved journal
  /journals/list:
    get:
      summary: List all journal records
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Journal list
  /morning-writings:
    get:
      summary: Get morning writing by date
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Morning writing record
    post:
      summary: Upsert morning writing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMorningWritingRequest"
      responses:
        "200":
          description: Saved morning writing
  /morning-writings/list:
    get:
      summary: List all morning writing records
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Morning writing list
  /stock-reviews/list:
    get:
      summary: List all stock review records
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Stock review list
  /water-records:
    get:
      summary: Get water record by date
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Water record
    post:
      summary: Save water cup count
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveWaterRecordRequest"
      responses:
        "200":
          description: Saved water record
  /quick-notes:
    get:
      summary: List quick notes with cursor pagination
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
        - in: query
          name: tag
          schema:
            type: string
            maxLength: 64
        - in: query
          name: keyword
          schema:
            type: string
            maxLength: 120
        - in: query
          name: state
          schema:
            type: string
            enum: [active, archived, deleted]
            default: active
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated Quick Note list
    post:
      summary: Create a quick note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuickNoteRequest"
      responses:
        "200":
          description: Created quick note
  /quick-notes/{id}:
    get:
      summary: Get a Quick Note owned by the current user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Quick Note detail
    put:
      summary: Edit a Quick Note with optimistic concurrency
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuickNoteRequest"
      responses:
        "200":
          description: Updated Quick Note
        "409":
          description: expectedVersion conflict
    delete:
      summary: Soft delete a Quick Note
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickNoteVersionRequest"
      responses:
        "200":
          description: Soft-deleted Quick Note
  /quick-notes/{id}/archive:
    post:
      summary: Archive a Quick Note
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuickNoteVersionRequest" }
      responses:
        "200": { description: Archived Quick Note }
  /quick-notes/{id}/unarchive:
    post:
      summary: Return an archived Quick Note to the active library
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuickNoteVersionRequest" }
      responses:
        "200": { description: Active Quick Note }
  /quick-notes/{id}/restore:
    post:
      summary: Restore a soft-deleted Quick Note
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuickNoteVersionRequest" }
      responses:
        "200": { description: Restored Quick Note }
  /quick-notes/{id}/convert-to-task:
    post:
      summary: Atomically convert one Quick Note snapshot into its single directly linked Task
      description: Uses operation receipts and the Tasks transaction-aware publish capability. The Task response never expands Quick Note body or tag.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertQuickNoteRequest" }
      responses:
        "200": { description: Task, optional Assignment, source relation, and receipt committed atomically }
        "409": { description: Reused operationId with changed parameters or Quick Note already converted }
  /settings:
    get:
      summary: Read profile, display preferences, continuation capability, and all current categories
      responses:
        "200": { description: Settings snapshot; missing preference rows use read-only defaults }
    patch:
      summary: Update profile and display preferences
      description: Timezone changes affect defaults for future records only and never rewrite historical business dates or timezone snapshots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 64 }
                timezone: { type: string, example: Asia/Shanghai }
                reducedMotion: { type: boolean }
                showRewards: { type: boolean }
      responses:
        "200": { description: Updated settings snapshot }
  /search:
    get:
      summary: Search stable user-owned domains without a copied search index
      description: Includes archived Tasks and Quick Notes, excludes soft-deleted records, and returns only result summaries and deep links.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: type
          schema: { type: string, enum: [task, quick_note, journal, morning_writing, schedule] }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200": { description: Deterministically ordered cursor page }
  /exports/{domain}:
    get:
      summary: Generate one user-triggered domain export from canonical records
      parameters:
        - in: path
          name: domain
          required: true
          schema: { type: string, enum: [tasks, writing, calendar, rewards, life] }
        - in: query
          name: format
          required: true
          schema: { type: string, enum: [json, csv, markdown] }
        - in: query
          name: includeTrash
          schema: { type: boolean, default: false }
      responses:
        "200": { description: File metadata, record count, and generated content; Markdown is writing-only }
  /rewards:
    get:
      summary: Get growth, reward items, recent rewards, and redemptions
      responses:
        "200":
          description: Reward center payload
  /rewards/items:
    post:
      summary: Create a custom reward item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRewardItemRequest"
      responses:
        "200":
          description: Created reward item
  /rewards/items/{id}:
    put:
      summary: Update a custom reward item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Updated reward item
    delete:
      summary: Hard delete a custom reward item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Deleted reward item
  /rewards/items/{id}/redeem:
    post:
      summary: Redeem a custom reward item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Redeemed reward item
  /ai-insights:
    get:
      summary: List AI writing insights
      parameters:
        - in: query
          name: sourceType
          schema:
            type: string
            enum: [morning, journal]
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: AI insight list
  /ai-insights/analyze:
    post:
      summary: Analyze morning writing or journal content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInsightRequest"
      responses:
        "200":
          description: Saved AI insight
  /decision-tools/decisions:
    get:
      summary: List decision records
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Decision record list
    post:
      summary: Save a decision balance record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDecisionRecordRequest"
      responses:
        "200":
          description: Saved decision record
  /decision-tools/bridges:
    get:
      summary: List psychological bridge records
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Psychological bridge record list
  /decision-tools/bridges/generate:
    post:
      summary: Generate and save a psychological bridge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePsychologicalBridgeRequest"
      responses:
        "200":
          description: Generated and saved psychological bridge
  /tasks:
    get:
      summary: List tasks
      parameters:
        - in: query
          name: status
          schema:
            type: integer
        - in: query
          name: categoryId
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Task list
    post:
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "200":
          description: Created task
  /tasks/reorder:
    put:
      summary: Reorder tasks by current visible order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskIds]
              properties:
                taskIds:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "200":
          description: Reordered tasks
  /tasks/{id}:
    get:
      summary: Read a Task detail aggregate
      description: Returns the Task, Assignment history, Planned blocks, and canonical Timer/Manual/Legacy Actual history.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Task detail aggregate
        "404":
          description: Task not found for the authenticated user
    put:
      summary: Update task title, description, category, due time, difficulty, or progress
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Updated task
    delete:
      summary: Soft-remove a Task and close pending continuations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedCommandRequest"
      responses:
        "200":
          description: Task soft-removed with historical facts preserved
        "409":
          description: Version or operation identity conflict
  /tasks/{id}/pinned:
    put:
      summary: Mark task as important
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                pinned:
                  type: boolean
      responses:
        "200":
          description: Updated task importance
  /tasks/{id}/status:
    put:
      summary: Update a non-completion task status
      description: Task completion is only available through PUT /tasks/{id}/complete.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskStatusRequest"
      responses:
        "200":
          description: Updated task
        "400":
          description: Invalid status transition or an attempt to complete through the generic status endpoint
  /tasks/{id}/complete:
    put:
      summary: Complete a Task without an active Session
      description: Creates one completion event per real lifecycle transition and grants the first-completion reward at most once. A matching operationId retry replays the committed result.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTaskRequest"
      responses:
        "200":
          description: Task transition, completion event, continuation closure, reward, and receipt committed atomically
        "409":
          description: Active Session, stale version, or operation identity conflict
  /tasks/{id}/reopen:
    put:
      summary: Reopen a completed Task without resurrecting old continuations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReopenTaskRequest"
      responses:
        "200":
          description: Task reopened
        "409":
          description: Task is not complete, stale version, active Session, or operation identity conflict
  /tasks/{id}/archive:
    put:
      summary: Archive a Task and close pending continuations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedCommandRequest"
      responses:
        "200":
          description: Task archived
  /timer-sessions/start:
    post:
      summary: Start a previously accepted Task Session
      description: Atomically claims the execution slot and creates a vNext Session and first Segment. Matching retries replay the same Session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTimerRequest"
      responses:
        "200":
          description: Started timer session
        "409":
          description: Another Session owns the slot, Task/Assignment version conflict, or operationId conflict
  /timer-sessions/accept-and-start:
    post:
      summary: Accept a Task and start its Session atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptAndStartTimerRequest"
      responses:
        "200":
          description: Assignment, Task state, Session, Segment, slot, and receipt committed
        "409":
          description: Slot, Task version, or operation identity conflict
  /timer-sessions/current:
    get:
      summary: Get the current vNext execution session
      description: Pure read through user_execution_slots. Frozen legacy sessions are never eligible.
      responses:
        "200":
          description: Current vNext Session with Segments, or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/CurrentTimerSession"
  /timer-sessions/actual-time:
    get:
      summary: Get normalized ActualTime entries
      description: Includes closed TimerSegments and manual/eligible legacy Actual Schedules. TIMER Schedule projections are excluded.
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: timezone
          required: true
          schema:
            type: string
            example: Asia/Shanghai
      responses:
        "200":
          description: ActualTime entries clipped to the requested timezone day
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [date, timezone, entries]
                        properties:
                          date:
                            type: string
                            format: date
                          timezone:
                            type: string
                          entries:
                            type: array
                            items:
                              $ref: "#/components/schemas/ActualTimeEntry"
  /timer-sessions/{id}/pause:
    put:
      summary: Pause a running vNext Session
      description: Closes the open Segment and writes its TIMER projections in one transaction. The slot remains occupied and no final reward is granted.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Segment closed, projections written, Session paused, receipt committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionResultResponse"
        "404":
          description: Timer session does not belong to the authenticated user
        "409":
          description: Version, slot consistency, Session state, legacy model, or operation identity conflict
  /timer-sessions/{id}/resume:
    put:
      summary: Resume a paused vNext Session with a new Segment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCommandRequest"
      responses:
        "200":
          description: Exactly one new open Segment created
        "409":
          description: Version, slot consistency, Session state, legacy model, or operation identity conflict
  /timer-sessions/{id}/finish:
    put:
      summary: Finish a work session, optionally completing its task
      description: Repeating the same terminal command returns the existing result. A different command against a terminal session returns 409.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishWorkSessionRequest"
      responses:
        "200":
          description: Segments, all projections, rewards, slot release, and optional Task completion committed atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionResultResponse"
        "404":
          description: Timer session or associated task does not belong to the authenticated user
        "409":
          description: Version, slot consistency, terminal state, Task version, legacy model, or operation identity conflict
  /timer-sessions/{id}/cancel:
    put:
      summary: Cancel an active vNext Session and void its time facts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCommandRequest"
      responses:
        "200":
          description: Segments and projections voided, no reward granted, slot released
        "409":
          description: Finished, stale, inconsistent, legacy, or operation identity conflict
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
    AuthUser:
      type: object
      required: [id, username, displayName, timezone]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        timezone:
          type: string
          example: Asia/Shanghai
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [token, user]
              properties:
                token:
                  type: string
                user:
                  $ref: "#/components/schemas/AuthUser"
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
